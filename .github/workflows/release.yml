name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint and Build
        run: |
          npm run lint
          npm run build
        env:
          NODE_ENV: production

      - name: Archive Web Release
        run: |
          tar -czvf satexpert-tsi-web-${{ github.ref_name }}.tar.gz dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: satexpert-tsi-web-${{ github.ref_name }}.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
